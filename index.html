<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luyện đề Vật lí 12</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#d9dfec;--pr:#2457d6;--prt:#fff;--ok:#16794c;--okb:#e3f5ec;--no:#b42318;--nob:#fde8e6;--sel:#e8eefc}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#9aa4b8;--bd:#2f3750;--pr:#6b93ff;--prt:#0d1220;--ok:#5fd09a;--okb:#143326;--no:#ff8d82;--nob:#3a1b19;--sel:#232c47}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:17px;margin:0 0 8px}.mu{color:var(--mu);font-size:14px}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 16px}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.nav button{padding:6px 0}.nav .d{background:var(--sel);border-color:var(--pr)}.nav .c{outline:2px solid var(--pr)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;margin:8px 0;cursor:pointer}
.opt.s{background:var(--sel);border-color:var(--pr)}.opt b{min-width:22px}
.tf{padding:8px 0;border-top:1px solid var(--bd)}.tf .b{display:flex;gap:8px;margin-top:6px}.tf .b button{flex:1}.tf .b .s{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.q img{max-width:100%;vertical-align:middle}.q img.m{height:1.5em;width:auto}.q-table{border-collapse:collapse}.q-table td{border:1px solid var(--bd);padding:4px 8px}
.ok{background:var(--okb);border-color:var(--ok)}.no{background:var(--nob);border-color:var(--no)}
.score{font-size:42px;font-weight:700;color:var(--pr)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.modal .card{max-width:360px;margin:0}
.hide{display:none}
</style></head><body><div class="wrap" id="app"></div>

const BANK = [{"t":"mcq","n":1,"s":"Nội dung thí nghiệm Brown là","o":["quan sát hạt phấn hoa bằng kính hiển vi.","quan sát chuyển động của hạt phấn hoa trong nước bằng kính hiển vi.","quan sát cánh hoa trong nước bằng kính hiển vi.","quan sát chuyển động của cánh hoa."],"c":1},{"t":"mcq","n":2,"s":"Trong thí nghiệm của Brown các hạt phấn hoa chuyển động hỗn độn không ngừng vì","o":["giữa chúng có khoảng cách.","chúng là các phân tử.","các phân tử nước chuyển động không ngừng, va chạm vào chúng từ mọi phía.","chúng là các thực thể sống."],"c":2},{"t":"mcq","n":3,"s":"Các phân tử khí chuyển động hỗn loạn không ngừng vì","o":["phân tử khí không có khối lượng.","khoảng cách giữa các phân tử khí quá gần nhau.","lực tương tác giữa các phân tử quá nhỏ.","các phân tử khí luôn đẩy nhau."],"c":2},{"t":"mcq","n":4,"s":"Phát biểu nào sau đây là sai khi nói về chất khí?","o":["Các phân tử khí ở rất gần nhau so với các phân tử chất lỏng.","Lực tương tác giữa các nguyên tử, phân tử là rất yếu.","Chất khí không có hình dạng riêng và thể tích riêng.","Chất khí luôn luôn chiếm toàn bộ thể tích bình chứa và có thể nén được dễ dàng."],"c":0},{"t":"mcq","n":5,"s":"Tính chất nào sau đây không phải là tính chất của chất ở thể khí?","o":["Có hình dạng và thể tích riêng.","Có các phân tử chuyển động hoàn toàn hỗn độn.","Có thể nén được dễ dàng.","Có lực tương tác phân tử nhỏ hơn lực tương tác phân tử ở thể rắn và thể lỏng."],"c":0},{"t":"mcq","n":6,"s":"Hãy tìm ý không đúng với mô hình động học phân tử trong các ý sau?","o":["Các chất được cấu tạo từ các hạt riêng biệt là phân tử.","Các phân tử chuyển động không ngừng.","Tốc độ chuyển động của các phân tử cấu tạo nên vật càng lớn thì thể tích của vật càng lớn.","Giữa các phân tử có lực tương tác gọi là lực liên kết phân tử."],"c":2},{"t":"mcq","n":7,"s":"Một số chất khí có mùi thơm toả ra từ bông hoa hồng làm ta có thể ngửi thấy mùi hoa thơm. Điều này thể hiện tính chất nào của thể khí?","o":["Dễ dàng nén được.","Không có hình dạng xác định.","Có thể lan toả trong không gian theo mọi hướng.","Không chảy được."],"c":2},{"t":"mcq","n":9,"s":"Trường hợp nào sau đây không xảy ra sự nóng chảy?","o":["Bỏ cục nước đá vào một cốc nước.","Đốt một ngọn nến.","Đốt một ngọn đèn dầu.","Đúc một cái chuông đồng."],"c":2},{"t":"mcq","n":10,"s":"Trong các trường hợp dưới đây, trường hợp nào liên quan đến sự bay hơi?","o":["Kính cửa sổ bị mờ đi trong những ngày đông giá lạnh.","Cốc nước bị cạn dần khi để ngoài trời nắng.","Miếng bơ để bên ngoài tủ lạnh sau một thời gian bị chảy lỏng.","Đưa nước vào trong tủ lạnh để làm đá."],"c":1},{"t":"mcq","n":11,"s":"Thuỷ ngân có nhiệt độ nóng chảy là - 39℃ và nhiệt sôi là 357℃. Khi trong phòng có nhiệt độ là 30℃ thì thuỷ ngân","o":["chỉ tồn tại ở thể lỏng.","chỉ tồn tại ở thể hơi.","tồn tại ở cả thể lỏng và thể hơi.","tồn tại ở cả thể lỏng, thể rắn và thể hơi."],"c":2},{"t":"mcq","n":12,"s":"Trường hợp nào sau đây liên quan tới sự nóng chảy?","o":["Sương đọng trên lá cây.","Khăn ướt sẽ khô khi được phơi ra nắng.","Đun nước đổ đầy ấm, nước có thể tràn ra ngoài.","Cục nước đá bỏ từ tủ đá ra ngoài, sau một thời gian, tan thành nước."],"c":3},{"t":"mcq","n":13,"s":"Nước đựng trong cốc bay hơi càng nhanh khi","o":["Nước trong cốc càng nhiều.","Nước trong cốc càng ít.","Nước trong cốc càng nóng.","Nước trong cốc càng lạnh."],"c":2},{"t":"mcq","n":14,"s":"Hiện tượng nào sau đây không phải là sự ngưng tụ?","o":["Sương đọng trên lá cây.","Sự tạo thành sương mù.","Sự tạo thành hơi nước.","Sự tạo thành mây."],"c":2},{"t":"mcq","n":15,"s":"Sự bay hơi","o":["xảy ra ở bất kì nhiệt độ nào của chất lỏng.","chỉ xảy ra ở trong lòng chất lỏng.","xảy ra với tốc độ như nhau ở mọi nhiệt độ.","chỉ xảy ra đối với một số ít chất lỏng."],"c":0},{"t":"mcq","n":16,"s":"Những quá trình chuyển thể nào của đồng được vận dụng trong việc đúc tượng đồng?","o":["Nóng chảy và bay hơi.","Nóng chảy và đông đặc.","Bay hơi và đông đặc.","Bay hơi và ngưng tụ."],"c":1},{"t":"mcq","n":17,"s":"Đưa cốc nước lạnh ra ngoà rắn và thể lỏng","Đoạn CD cho biết nước không tồn tại ở thể lỏng","Đoạn AB cho biết nước đang tồn tại ở thể rắn","Đoạn BC cho biết nước đang sôi"],"c":[true,true,false,true]},{"t":"tf","n":3,"s":"Bảng dưới đây ghi nhiệt độ nóng chảy (đông đặc) của một số chất<br><table class=\"q-table\"><tr><td>Chất<\/td><td>Đồng<\/td><td>Vàng<\/td><td>Bạc<\/td><td>Nước<\/td><td>Thủy ngân<\/td><td>Rượu<\/td><\/tr><tr><td>Nhiệt độ nóng chảy (oC)<\/td><td>1083<\/td><td>1063<\/td><td>960<\/td><td>0<\/td><td>-39<\/td><td>-114<\/td><\/tr><\/table>","o":["Ở nhiệt độ phòng ( khoảng 25°C) nước, thủy ngân, rượu ở thể lỏng.","Ở nhiệt độ phòng ( khoảng 25°C) đồng, vàng, bạc ở thể lỏng.","Vì các chất nước, thủy ngân, rượu có nhiệt độ nóng chảy (đông đặc) nhỏ hơn 25°C. Nên ở 25°C chúng không tồn tại ở thể rắn, chúng đang ở thể khí.","Các chất đồng, vàng, bạc, có nhiệt độ nóng chảy lớn hơn 25°C."],"c":[true,false,false,true]},{"t":"tf","n":4,"s":"Hiện nay, kính cường lực (chịu lực rất tốt) thường được sử dụng để làm một phần tường của các tòa nhà, chung cư hay thương mại,… thay thế các vật liệu gạch, bê tông. Tuy nhiên, vào những ngày mùa hè, nếu bước vào những căn phòng có tường làm bằng kính cường lực bị đóng kín, ta thường thấy không khí trong phòng nóng hơn so với bên ngoài. Dưới đây là những biện pháp đơn giản để làm giảm sự tăng nhiệt độ của không khí trong phòng đó khi trời nắng nóng vào mùa hè?","o":["Mở cửa để không khí đối lưu với bên ngoài, từ đó làm giảm nội năng của không khí trong phòng và nhiệt độ phòng giảm xống. Đ","Lắp rèm cửa bằng vải dày chuyên dụng, màu sẫm, bề mặt lượn sóng.","Dán tấm phim cách nhiệt có cấu tạo đặc biệt (từ nhiều lớp polyester và chống ánh sáng tử ngoại.","Đóng tất cả các cửa ở các lối vào, ra của tòa nhà để làm giảm nội năng căn phòng."],"c":[true,false,true,false]},{"t":"tf","n":5,"s":"Dùng tay ấn mạnh và nhanh pit-tông, vừa nung nóng khí bằng ngọn lửa đèn cồn.","o":["Công A &gt; 0 vì khí bị nén (khí nhận công).","Nhiệt lượng Q &lt; 0 vì khí bị nung nóng (khí nhận nhiệt).","Nội năng của khí tăng ΔU &gt; 0","Biểu thức liên hệ độ biến thiên nội năng, công và nhiệt lượng là ΔU = A – Q."],"c":[true,false,true,false]},{"t":"tf","n":6,"s":"Bảng sau đây ghi sự thay đổi nhiệt độ của không khí theo thời gian dựa trên số liệu của một trạm khí tượng ở Hà Nội ghi được vào một ngày mùa đông.<br><table class=\"q-table\"><tr><td>Thời gian (giờ)<\/td><td>1<\/td><td>4<\/td><td>7<\/td><td>10<\/td><td>13<\/td><td>16<\/td><td>19<\/td><td>22<\/td><\/tr><tr><td>Nhiệt độ (oC)<\/td><td>13<\/td><td>13<\/td><td>13<\/td><td>18<\/td><td>18<\/td><td>20<\/td><td>17<\/td><td>12<\/td><\/tr><\/table>","o":["Nhiệt độ lúc 4 giờ là 13oC.","Nhiệt độ thấp nhất trong ngày là vào lúc 1 giờ.","Lúc 16 giờ thì nóng nhất.","Độ chênh nhiệt độ trong ngày là 6 0C."],"c":[true,false,true,false]},{"t":"tf","n":7,"s":"Xét tính đúng sai của các phát biểu dưới đây.","o":["Năng lượng nhiệt được truyền từ vật lạnh hơn sang vật nóng hơn.","Khi hai vật cùng nhiệt độ, không có sự truyền năng lượng nhiệt giữa chúng.","Nhiệt độ cho biết xu hướng truyền năng lượng nhiệt giữa các vật.","Phần năng lượng nhiệt truyền từ vật có nhiệt độ cao hơn sang vật có nhiệt độ thấp hơn được gọi là nhiệt lượng."],"c":[false,true,true,true]}];
/* ==================== */

const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const normName = s => s.trim().replace(/\s+/g, ' ');
let S = null, timer = null, submitted = false;

function start() {
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('stu') || '{}'); } catch (e) {}
  app.innerHTML = `<div class="card"><h1>${esc(CONFIG.title)}</h1><div class="mu">${esc(CONFIG.school)} · ${CONFIG.numQuestions} câu ngẫu nhiên mỗi lượt${CONFIG.minutes ? ' · ' + CONFIG.minutes + ' phút' : ''}</div>
  <label>Họ và tên</label><input id="nm" autocomplete="name" value="${esc(saved.n || '')}">
  <label>Lớp</label><input id="cl" placeholder="Ví dụ: 12A3" value="${esc(saved.c || '')}">
  <p id="er" class="mu" style="color:var(--no)"></p><button class="p" id="go" style="width:100%">Bắt đầu làm bài</button></div>`;
  $('#go').onclick = () => {
    const n = normName($('#nm').value), c = $('#cl').value.trim().toUpperCase().replace(/\s+/g, '');
    if (n.length < 3 || !c) { $('#er').textContent = 'Vui lòng nhập đầy đủ họ tên và lớp.'; return; }
    try { localStorage.setItem('stu', JSON.stringify({ n, c })); } catch (e) {}
    begin(n, c);
  };
}

function begin(name, cls) {
  const pick = shuffle(BANK).slice(0, Math.min(CONFIG.numQuestions, BANK.length));
  const qs = pick.map(q => q.t === 'mcq'
    ? { ...q, ord: shuffle([0, 1, 2, 3]), a: null }
    : { ...q, ord: [0, 1, 2, 3], a: [null, null, null, null] });
  S = { name, cls, qs, i: 0, t0: new Date(), id: (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2)), left: CONFIG.minutes * 60 };
  submitted = false; draw();
  if (CONFIG.minutes) { clearInterval(timer); timer = setInterval(() => { S.left--; tick(); if (S.left <= 0) { clearInterval(timer); finish(); } }, 1000); }
}

const answered = q => q.t === 'mcq' ? q.a !== null : q.a.every(x => x !== null);
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function tick() { const e = $('#tm'); if (e) e.textContent = fmt(Math.max(S.left, 0)); }

function draw() {
  const q = S.qs[S.i], done = S.qs.filter(answered).length, L = 'ABCD';
  let body = `<div class="q"><h2>Câu ${S.i + 1}${q.t === 'tf' ? ' · Đúng/Sai' : ''}</h2><div>${q.s}</div>`;
  if (q.t === 'mcq') {
    body += q.ord.map((k, p) => `<div class="opt ${q.a === p ? 's' : ''}" data-p="${p}"><b>${L[p]}.</b><div>${q.o[k]}</div></div>`).join('');
  } else {
    body += q.o.map((h, p) => `<div class="tf"><div><b>${'abcd'[p]})</b> ${h}</div><div class="b">
      <button data-p="${p}" data-v="1" class="${q.a[p] === true ? 's' : ''}">ĐÚNG</button><button data-p="${p}" data-v="0" class="${q.a[p] === false ? 's' : ''}">SAI</button></div></div>`).join('');
  }
  body += '</div>';
  app.innerHTML = `<div class="top"><div class="row"><b>${esc(S.name)} · ${esc(S.cls)}</b><b>${CONFIG.minutes ? '⏱ <span id="tm">' + fmt(Math.max(S.left, 0)) + '</span>' : ''}</b></div>
    <div class="bar"><i style="width:${done / S.qs.length * 100}%"></i></div><div class="mu">Đã làm ${done}/${S.qs.length} câu</div></div>
    <div class="card">${body}</div>
    <div class="row"><button id="pv" ${S.i === 0 ? 'disabled' : ''}>← Câu trước</button><button id="nx" ${S.i === S.qs.length - 1 ? 'disabled' : ''}>Câu sau →</button></div>
    <div class="card"><div class="nav">${S.qs.map((x, k) => `<button data-k="${k}" class="${answered(x) ? 'd' : ''} ${k === S.i ? 'c' : ''}">${k + 1}</button>`).join('')}</div></div>
    <button class="p" id="sb" style="width:100%">NỘP BÀI</button>`;
  app.querySelectorAll('.opt').forEach(e => e.onclick = () => { q.a = +e.dataset.p; draw(); });
  app.querySelectorAll('.tf button').forEach(e => e.onclick = () => { q.a[+e.dataset.p] = e.dataset.v === '1'; draw(); });
  app.querySelectorAll('.nav button').forEach(e => e.onclick = () => { S.i = +e.dataset.k; draw(); });
  $('#pv').onclick = () => { S.i--; draw(); }; $('#nx').onclick = () => { S.i++; draw(); };
  $('#sb').onclick = confirmSubmit;
}

function confirmSubmit() {
  const miss = S.qs.length - S.qs.filter(answered).length, m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="card"><h2>Nộp bài?</h2><p>${miss ? 'Bạn còn <b>' + miss + '</b> câu chưa làm xong.' : 'Bạn đã làm hết các câu.'} Sau khi nộp không thể sửa.</p>
    <div class="row"><button id="cn" style="flex:1">Làm tiếp</button><button id="ys" class="p" style="flex:1">Nộp bài</button></div></div>`;
  document.body.appendChild(m);
  $('#cn').onclick = () => m.remove();
  $('#ys').onclick = () => { m.remove(); finish(); };
}

/* Chấm điểm: ABCD 1 điểm/câu; Đúng/Sai theo thang THPT: 1 ý=0.1, 2 ý=0.25, 3 ý=0.5, 4 ý=1 (điểm của câu). Quy về thang 10. */
function grade() {
  const TF = [0, .1, .25, .5, 1]; let pts = 0, full = 0, cor = 0;
  S.qs.forEach(q => {
    if (q.t === 'mcq') { const ok = q.a !== null && q.ord[q.a] === q.c; q.ok = ok; if (ok) { pts++; cor++; } }
    else { const n = q.a.filter((v, p) => v === q.c[p]).length; q.n = n; q.ok = n === 4; pts += TF[n]; if (q.ok) cor++; }
  });
  return { score: Math.round(pts / S.qs.length * 100) / 10, cor };
}

function finish() {
  if (submitted) return; submitted = true; clearInterval(timer);   // chống nộp trùng
  const g = grade(), t1 = new Date(), sec = Math.round((t1 - S.t0) / 1000);
  S.res = { id: S.id, exam: CONFIG.examId, name: S.name, cls: S.cls, score: g.score, correct: g.cor, total: S.qs.length, start: S.t0.toISOString(), end: t1.toISOString(), seconds: sec };
  show(g, sec); send();
}

async function send() {
  const st = $('#st'); if (!CONFIG.sheetUrl) { if (st) st.textContent = 'Kết quả chưa được gửi cho giáo viên (chưa cấu hình sheetUrl).'; return; }
  try {
    await fetch(CONFIG.sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(S.res) });
    if ($('#st')) $('#st').textContent = '✓ Đã gửi kết quả cho giáo viên.';
  } catch (e) { if ($('#st')) $('#st').innerHTML = 'Chưa gửi được kết quả. <button id="rt">Gửi lại</button>'; if ($('#rt')) $('#rt').onclick = send; }
}

function show(g, sec) {
  const L = 'ABCD';
  const rev = S.qs.map((q, k) => {
    let inner = `<div><b>Câu ${k + 1}.</b> ${q.s}</div>`;
    if (q.t === 'mcq') {
      inner += q.ord.map((o, p) => { const right = o === q.c, mine = q.a === p;
        return `<div class="opt ${CONFIG.showAnswers && right ? 'ok' : (mine ? 'no' : '')}"><b>${L[p]}.</b><div>${q.o[o]}${mine ? ' <i class="mu">(bạn chọn)</i>' : ''}</div></div>`; }).join('');
    } else {
      inner += q.o.map((h, p) => { const mine = q.a[p], right = q.c[p];
        return `<div class="tf ${mine === right ? 'ok' : 'no'}" style="padding:8px;border-radius:8px;margin:6px 0"><b>${'abcd'[p]})</b> ${h}<div class="mu">Bạn chọn: ${mine === null ? 'chưa chọn' : mine ? 'ĐÚNG' : 'SAI'}${CONFIG.showAnswers ? ' · Đáp án: ' + (right ? 'ĐÚNG' : 'SAI') : ''}</div></div>`; }).join('');
    }
    return `<div class="card q"><span class="mu">${q.ok ? '✓ Đúng' : (q.t === 'tf' && q.n > 0 ? 'Đúng ' + q.n + '/4 ý' : '✗ Sai')}</span>${inner}</div>`;
  }).join('');
  app.innerHTML = `<div class="card" style="text-align:center"><div class="mu">${esc(S.name)} · ${esc(S.cls)}</div><div class="score">${g.score.toString().replace('.', ',')}/10</div>
    <div>Đúng hoàn toàn ${g.cor}/${S.qs.length} câu · Thời gian ${fmt(sec)}</div><p id="st" class="mu"></p>
    <button class="p" id="ag">Làm lượt mới (20 câu khác)</button></div>${rev}`;
  $('#ag').onclick = () => { start(); window.scrollTo(0, 0); };
  window.scrollTo(0, 0);
}

start();
</script></body></html>
